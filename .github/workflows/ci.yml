name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: inmybush_test
          POSTGRES_USER: inmybush
          POSTGRES_PASSWORD: inmybush
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U inmybush -d inmybush_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_NAME: inmybush_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify -Pit
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      SESSION_SECRET: ci-only-secret-never-use-in-production-1234
      NEXT_PUBLIC_USE_MOCKS: 'false'
      NEXT_PUBLIC_AUTH_BYPASS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
