# Services de dev local. Lancer : docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: inmybush-db
    environment:
      POSTGRES_DB: inmybush
      POSTGRES_USER: inmybush
      POSTGRES_PASSWORD: inmybush
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inmybush -d inmybush"]
      interval: 5s
      retries: 10

  adminer:
    image: adminer:4
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  db-data:
